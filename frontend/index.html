<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=12" />
  <script src="chart.umd.min.js"></script>
</head>
<body>
  <!-- Fixed left sidebar: Server Metrics -->
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">服务器状态</span>
        <span id="last-updated" class="last-updated">加载中…</span>
        <button id="refresh-btn" class="refresh-btn" title="立即刷新">↻</button>
      </div>
      <div id="servers-container" class="servers-container">
        <div class="loading">正在获取数据…</div>
      </div>
    </div>

    <div class="panel logshed-panel">
      <div class="panel-header">
        <span class="panel-title">Logshed 状态</span>
        <span id="logshed-banner" class="logshed-banner">—</span>
      </div>
      <div class="logshed-service">
        <div class="logshed-service-head">
          <span id="logshed-service-name" class="logshed-service-name">Logshed Search EU</span>
          <span id="logshed-6h-uptime" class="logshed-uptime-pct">—</span>
        </div>
        <div class="logshed-timeline-wrap">
          <div id="logshed-timeline" class="logshed-timeline"></div>
          <div id="logshed-timeline-tip" class="logshed-timeline-tip" hidden></div>
        </div>
        <div class="logshed-timeline-axis">
          <span>6h 前</span>
          <span>现在</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main centre area: Clock + Search + Cursor iframe -->
  <main class="main-area">
    <div class="clock-wrap">
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索…" autocomplete="off" />
        <button type="button" id="btn-google" class="btn-google">Google</button>
        <button type="button" id="btn-bing"   class="btn-bing">Bing</button>
      </div>
      <div class="quicklinks">
        <a href="http://ec2d-jenkinsmaster-02.mypna.com:8080/job/QA-DataValidation/job/Nav_DataValidation_Test_Refactor_Debug/" target="_blank" class="quicklink">Jenkins DV</a>
        <a href="https://cygnus.telenav.com/release_matrix/releases/index?mo=t&region=hkm%252Cisc%252Csea&version=26q3" target="_blank" class="quicklink">Cygnus Release</a>
        <a href="http://logshed-search-eu.prod.mypna.com/logshedSearch/" target="_blank" class="quicklink">Logshed</a>
        <button type="button" id="feed-toggle-btn" class="quicklink quicklink-toggle" aria-pressed="false">阅读</button>
      </div>
    </div>

    <section id="feed-panel" class="feed-panel panel" hidden>
      <div class="panel-header feed-panel-header">
        <span class="panel-title">阅读</span>
        <div class="feed-tabs" id="feed-tabs">
          <button type="button" class="feed-tab active" data-filter="all">全部</button>
          <button type="button" class="feed-tab" data-filter="zhihu">知乎</button>
          <button type="button" class="feed-tab" data-filter="bookmarked">收藏</button>
        </div>
        <span id="feed-status" class="feed-status">—</span>
        <button id="feed-refresh" class="refresh-btn" title="刷新">↻</button>
      </div>
      <div id="feed-list" class="feed-list">
        <div class="loading">点击上方「阅读」加载内容</div>
      </div>
      <div id="feed-sentinel" class="feed-sentinel" hidden></div>
    </section>

    <div id="feed-comments-modal" class="feed-comments-modal" hidden>
      <div class="feed-comments-backdrop"></div>
      <div class="feed-comments-card" role="dialog" aria-modal="true">
        <div class="feed-comments-header">
          <div>
            <span id="feed-comments-platform" class="feed-platform-tag">知乎</span>
            <h2 id="feed-comments-title" class="feed-comments-title"></h2>
          </div>
          <button type="button" id="feed-comments-close" class="feed-comments-close" title="关闭">×</button>
        </div>
        <div class="feed-comments-toolbar">
          <button type="button" id="feed-comments-bookmark" class="feed-bookmark-btn">☆ 收藏</button>
          <a id="feed-comments-link" href="#" target="_blank" rel="noopener" class="feed-open-link">在原平台打开 ↗</a>
        </div>
        <div id="feed-comments-list" class="feed-comments-list"></div>
        <button type="button" id="feed-comments-more" class="feed-comments-more" hidden>加载更多评论</button>
      </div>
    </div>

  </main>

  <!-- Cursor Usage Panel — fixed right sidebar -->
  <div class="cursor-panel">
    <div class="cursor-panel-header">
      <img src="https://cursor.com/favicon.ico" class="cursor-favicon" alt="" />
      <span>Cursor 用量</span>
      <span id="cursor-range" class="cursor-range"></span>
      <button id="cursor-refresh" class="refresh-btn" title="刷新">↻</button>
      <a href="https://cursor.com/cn/dashboard/usage" target="_blank" class="cursor-open-btn" title="在新标签页打开">↗</a>
    </div>
    <div class="cursor-chart-wrap">
      <canvas id="cursor-chart"></canvas>
      <div class="cursor-empty" id="cursor-empty" hidden>暂无数据或 Cookie 已过期</div>
    </div>
    <div class="cursor-stats" id="cursor-stats"></div>
  </div>

  <script src="script.js?v=16"></script>
</body>
</html>
